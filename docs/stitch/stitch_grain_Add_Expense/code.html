<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Grain - Add Expense</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .glass-card {
            background: rgba(23, 31, 51, 0.4);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glow-teal {
            box-shadow: 0 0 40px rgba(0, 223, 193, 0.15);
        }
        .rim-light {
            border-image: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0)) 1;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .input-inset {
            background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary": "#fff5ed",
                      "tertiary-fixed": "#ffddb4",
                      "on-surface-variant": "#b9cac4",
                      "on-primary-fixed": "#00201a",
                      "on-tertiary-fixed": "#291800",
                      "surface-bright": "#31394d",
                      "on-background": "#dae2fd",
                      "on-secondary": "#00315d",
                      "on-error": "#690005",
                      "on-primary-fixed-variant": "#005144",
                      "surface-dim": "#0b1326",
                      "on-tertiary-fixed-variant": "#633f00",
                      "surface-tint": "#00dfc1",
                      "error-container": "#93000a",
                      "inverse-surface": "#dae2fd",
                      "background": "#0b1326",
                      "tertiary-container": "#ffd39b",
                      "secondary-fixed-dim": "#a3c9ff",
                      "on-secondary-fixed": "#001c39",
                      "surface-container": "#171f33",
                      "on-surface": "#dae2fd",
                      "primary-fixed": "#26fedc",
                      "on-tertiary-container": "#845500",
                      "on-tertiary": "#452b00",
                      "primary-fixed-dim": "#00dfc1",
                      "on-error-container": "#ffdad6",
                      "inverse-primary": "#006b5b",
                      "outline-variant": "#3a4a46",
                      "on-secondary-container": "#002a51",
                      "outline": "#83948f",
                      "primary": "#d7fff3",
                      "on-secondary-fixed-variant": "#004883",
                      "error": "#ffb4ab",
                      "on-primary-container": "#006c5c",
                      "secondary": "#a3c9ff",
                      "primary-container": "#00f5d4",
                      "surface-container-low": "#131b2e",
                      "surface": "#0b1326",
                      "on-primary": "#00382f",
                      "inverse-on-surface": "#283044",
                      "surface-container-highest": "#2d3449",
                      "surface-container-high": "#222a3d",
                      "surface-variant": "#2d3449",
                      "surface-container-lowest": "#060e20",
                      "tertiary-fixed-dim": "#ffb955",
                      "secondary-fixed": "#d3e3ff",
                      "secondary-container": "#1493ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "gutter": "24px",
                      "stack-md": "12px",
                      "margin-desktop": "40px",
                      "base": "8px",
                      "stack-sm": "4px",
                      "stack-lg": "32px"
              },
              "fontFamily": {
                      "display-lg": ["Sora"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Sora"],
                      "numeral-xl": ["Sora"],
                      "label-caps": ["Inter"],
                      "display-lg-mobile": ["Sora"]
              },
              "fontSize": {
                      "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "numeral-xl": ["40px", {"lineHeight": "1.0", "letterSpacing": "-0.04em", "fontWeight": "600"}],
                      "label-caps": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.1em", "fontWeight": "700"}],
                      "display-lg-mobile": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen overflow-x-hidden selection:bg-primary-fixed/30">
<!-- Atmospheric Background Layers -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-primary-container/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-container/5 blur-[100px] rounded-full"></div>
</div>
<!-- Top Navigation (Contextual Suppression of Main Nav for Task Focus) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface/10 backdrop-blur-2xl border-b border-white/10 shadow-[0_0_20px_rgba(0,223,193,0.1)]">
<button class="p-2 hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary-fixed">close</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile tracking-tight text-primary-fixed">Grain</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="relative z-10 pt-24 pb-32 px-margin-mobile max-w-lg mx-auto">
<!-- Prominent Numeric Input Area -->
<section class="mb-stack-lg text-center">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-stack-sm block">AMOUNT</label>
<div class="relative group">
<span class="absolute left-0 top-1/2 -translate-y-1/2 font-numeral-xl text-numeral-xl text-primary-fixed/50">$</span>
<input autofocus="" class="w-full bg-transparent border-none text-center font-numeral-xl text-[64px] leading-tight text-primary-fixed focus:ring-0 placeholder:text-surface-variant transition-all glow-teal" placeholder="0.00" type="number"/>
<div class="mt-2 h-[2px] w-32 mx-auto bg-gradient-to-r from-transparent via-primary-fixed to-transparent opacity-30"></div>
</div>
</section>
<!-- Main Form Glass Card -->
<div class="glass-card rounded-[2rem] p-6 space-y-stack-lg">
<!-- Category Selector -->
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant mb-stack-md block">CATEGORY</label>
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
<button class="flex-shrink-0 px-4 py-2 rounded-full border border-primary-fixed bg-primary-fixed/20 text-primary-fixed shadow-[0_0_15px_rgba(0,223,193,0.3)] transition-all">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">shopping_bag</span>
<span class="text-[14px] font-bold">Shopping</span>
</div>
</button>
<button class="flex-shrink-0 px-4 py-2 rounded-full border border-white/10 bg-white/5 text-on-surface-variant hover:bg-white/10 transition-all">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">restaurant</span>
<span class="text-[14px] font-bold">Dining</span>
</div>
</button>
<button class="flex-shrink-0 px-4 py-2 rounded-full border border-white/10 bg-white/5 text-on-surface-variant hover:bg-white/10 transition-all">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">commute</span>
<span class="text-[14px] font-bold">Transport</span>
</div>
</button>
<button class="flex-shrink-0 px-4 py-2 rounded-full border border-white/10 bg-white/5 text-on-surface-variant hover:bg-white/10 transition-all">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">bolt</span>
<span class="text-[14px] font-bold">Utilities</span>
</div>
</button>
</div>
</div>
<!-- Modern Date Selector & Account Picker Bento -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block">DATE</label>
<div class="relative group">
<input class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-3 text-on-surface focus:border-primary-fixed focus:ring-0 transition-all text-sm appearance-none" type="date"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-primary-fixed/60 pointer-events-none">calendar_today</span>
</div>
</div>
<div class="space-y-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block">ACCOUNT</label>
<div class="relative group">
<select class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-3 text-on-surface focus:border-primary-fixed focus:ring-0 transition-all text-sm appearance-none">
<option>Main Savings</option>
<option>Crypto Wallet</option>
<option>Cash</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-primary-fixed/60 pointer-events-none">account_balance_wallet</span>
</div>
</div>
</div>
<!-- Notes Field -->
<div class="space-y-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block">NOTES</label>
<div class="relative">
<textarea class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-on-surface focus:border-primary-fixed focus:ring-0 transition-all text-sm resize-none" placeholder="What was this for?" rows="3"></textarea>
<div class="absolute bottom-3 right-3 text-[10px] text-on-surface-variant/40 font-bold tracking-widest">OPTIONAL</div>
</div>
</div>
<!-- Receipt Upload Placeholder -->
<div class="mt-4">
<div class="border-2 border-dashed border-white/10 rounded-xl p-6 flex flex-col items-center justify-center gap-2 hover:bg-white/5 transition-all cursor-pointer group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed transition-colors">add_a_photo</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">ATTACH RECEIPT</span>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile z-50 bg-gradient-to-t from-background via-background/80 to-transparent pt-12">
<div class="max-w-lg mx-auto">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md py-4 rounded-full shadow-[0_0_30px_rgba(0,245,212,0.4)] active:scale-95 transition-all flex items-center justify-center gap-2 group">
                Save Expense
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward_ios</span>
</button>
</div>
</div>
<!-- Visual Polish: Floating Shapes -->
<div class="fixed top-1/3 right-[-50px] w-[150px] h-[150px] border border-primary-fixed/20 rounded-full blur-sm animate-pulse z-0 pointer-events-none"></div>
<div class="fixed bottom-1/4 left-[-30px] w-[80px] h-[80px] border border-secondary-container/20 rounded-full blur-md z-0 pointer-events-none"></div>
<script>
        // Simple micro-interaction for category chip selection
        const chips = document.querySelectorAll('.flex-shrink-0.px-4');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('border-primary-fixed', 'bg-primary-fixed/20', 'text-primary-fixed', 'shadow-[0_0_15px_rgba(0,223,193,0.3)]');
                    c.classList.add('border-white/10', 'bg-white/5', 'text-on-surface-variant');
                });
                chip.classList.add('border-primary-fixed', 'bg-primary-fixed/20', 'text-primary-fixed', 'shadow-[0_0_15px_rgba(0,223,193,0.3)]');
                chip.classList.remove('border-white/10', 'bg-white/5', 'text-on-surface-variant');
            });
        });

        // Haptic-like interaction on button
        const mainBtn = document.querySelector('button.bg-primary-container');
        mainBtn.addEventListener('mousedown', () => {
            mainBtn.style.boxShadow = '0 0 10px rgba(0, 245, 212, 0.2)';
        });
        mainBtn.addEventListener('mouseup', () => {
            mainBtn.style.boxShadow = '0 0 30px rgba(0, 245, 212, 0.4)';
        });
    </script>
</body></html>
