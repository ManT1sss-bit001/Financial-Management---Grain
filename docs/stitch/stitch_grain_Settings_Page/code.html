<script>
        // Simple Interaction logic for Accent Picker
        const accentButtons = document.querySelectorAll('.flex.gap-stack-md button:not(:last-child)');
        accentButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                accentButtons.forEach(b => b.classList.remove('ring-2', 'ring-white/40', 'ring-offset-2', 'ring-offset-surface'));
                btn.classList.add('ring-2', 'ring-white/40', 'ring-offset-2', 'ring-offset-surface');
            });
        });

        // Toggle Dark Mode Simulation (UI Only)
        const toggle = document.querySelector('input[type="checkbox"]');
        toggle.addEventListener('change', (e) => {
            if(!e.target.checked) {
                // In a real app, this would swap class on HTML
                console.log("Light mode requested - This UI is optimized for Premium Dark Mode");
            }
        });
